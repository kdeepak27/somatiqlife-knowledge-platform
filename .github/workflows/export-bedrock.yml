name: Build Bedrock export
on: {workflow_dispatch: {}}
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m scripts.export
      - name: Commit export
        run: |
          git config user.name "somatiq-content-bot"
          git config user.email "somatiq-content-bot@users.noreply.github.com"
          git add bedrock-export
          if git diff --cached --quiet; then echo "No export changes."; exit 0; fi
          git commit -m "Refresh Bedrock export"
          git push
